<nav class="nav">
  <a class="brand" href="../index.html">Sleep</a>

<main class="wrap">
  <header class="pagehead">
    <h1>Sleep efficiency <span class="badge badge-moderate" title="Derived from wake detection or proprietary movement processing. Wake specificity is only 29-52%, so values skew optimistic and compress.">moderate</span></h1>
    <p class="sub">Score component · weight 0.5 · <span id="contrib"></span></p>
  </header>
  <section class="stats" id="stats"></section>
  <section class="card">
    <div class="controls">
      <div class="seg" id="view-toggle" role="tablist">
        <button data-view="daily" class="on">Daily</button>
        <button data-view="weekly">Weekly</button>
        <button data-view="quarterly">Quarterly</button>
        <button data-view="annual">Annual</button>
      </div>
    </div>
    <div id="chart" class="chart"></div>
  </section>
  <section class="card">
    <div class="controls">
      <h2>Best &amp; worst nights</h2>
      <div class="seg" id="tb-toggle">
        <button data-period="all" class="on">All time</button>
        <button data-period="year">Last year</button>
        <button data-period="quarter">Last 90d</button>
      </div>
    </div>
    <div class="tb" id="tb"></div>
  </section>
</main>
