name: Daily Sleep Analytics

on:
  schedule:
    # 14:00 UTC is 10am Eastern in summer, 9am in winter. Cron has no timezone,
    # and the winter drift is accepted.
    #
    # Minute 23, not 00, on evidence. All 13 scheduled runs between 2026-08-27
    # and 09-08 fired against a :00 cron and every one was late: 2.7h at best,
    # 3.9h median, 9.8h at worst, none within an hour. GitHub queues scheduled
    # workflows at low priority and the on-the-hour slot is the most contested,
    # so an odd minute is the one lever aimed at the queue itself rather than
    # at working around it. It may not be enough — watch the run times.
    #
    # Four attempts a day, not one, because GitHub's scheduler is unreliable:
    # it skipped 2026-09-09 outright, and every run in a two-week sample was
    # 2.7 to 9.8 hours late. Four cheap idempotent attempts make a skipped or
    # delayed one stop mattering. (Oura can also lag in releasing a night's
    # session, and the ring uploads only when the app is opened; a later
    # attempt covers those too — but note the days-long "last night is
    # missing" problem was our own end_date bug, fixed in ingest.py, not
    # either of these.) Extra pulls cost nothing: the 30-day lookback plus
    # field-wise upsert makes them idempotent, and public-repo Actions
    # minutes are not billed.
    - cron: "23 14 * * *"   # 10:23am Eastern (9:23am in winter)
    - cron: "23 19 * * *"   #  3:23pm Eastern
    - cron: "23 23 * * *"   #  7:23pm Eastern
    - cron: "23 3 * * *"    # 11:23pm Eastern, on the previous Eastern day
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sleep-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull data, compute metrics, rebuild site
        env:
          OURA_PAT: ${{ secrets.OURA_PAT }}
        run: python run.py

      - name: Commit updated data & site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            # Eastern, not UTC: the late run fires after midnight UTC, so a UTC
            # stamp would misdate it. The time is included because four runs a
            # day would otherwise produce four identically-worded commits.
            git commit -m "data: update ($(TZ=America/New_York date '+%Y-%m-%d %H:%M') ET)"
            git push
          fi
