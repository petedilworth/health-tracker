name: Daily Sleep Analytics

on:
  schedule:
    # 13:00 UTC — the previous night has synced from the ring by then.
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sleep-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull data, compute metrics, rebuild site
        env:
          OURA_PAT: ${{ secrets.OURA_PAT }}
        run: python run.py

      - name: Commit updated data & site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: daily update ($(date -u +%Y-%m-%d))"
            git push
          fi
