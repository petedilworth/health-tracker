name: Daily Oura Analytics

on:
  schedule:
    # 13:00 UTC ≈ morning in North America — the previous night has synced by then.
    - cron: "0 13 * * *"
  workflow_dispatch: {}  # allow manual runs from the Actions tab

# Needed so the job can commit the updated CSV + dashboard PNG back to the repo.
permissions:
  contents: write

concurrency:
  group: daily-oura
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          OURA_PAT: ${{ secrets.OURA_PAT }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Sandbox sender, no domain verification needed. Override by adding
          # a MAIL_FROM repo secret once you verify your own domain in Resend.
          MAIL_FROM: ${{ secrets.MAIL_FROM || 'onboarding@resend.dev' }}
        run: python run.py

      - name: Commit updated data & dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ images/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily Oura data update ($(date -u +%Y-%m-%d))"
            git push
          fi
