name: Daily Sleep Analytics

on:
  schedule:
    # Twice daily. The ring only syncs when the phone app opens, so a single
    # run can land before last night's session exists: on 2026-09-08 the 13:00
    # pull got Oura's daily score for the night but not the session behind it,
    # and the site showed the night before as the latest. The 30-day lookback
    # plus field-wise upsert makes the second pull idempotent.
    - cron: "0 13 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sleep-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull data, compute metrics, rebuild site
        env:
          OURA_PAT: ${{ secrets.OURA_PAT }}
        run: python run.py

      - name: Commit updated data & site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: daily update ($(date -u +%Y-%m-%d))"
            git push
          fi
