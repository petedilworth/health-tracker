<main class="wrap">
  <header class="pagehead">
    <h1>Light sleep <span class="badge badge-low" title="Sleep-stage inference. Four-stage agreement with polysomnography is ~76-79%; treat night-to-night changes as directional, not exact.">low</span></h1>
    <p class="note">Sleep-stage inference is ~76–79% accurate against polysomnography — read this chart as directional, not exact. The shaded band shows ±1 SD of the trailing month.</p>
  </header>
  <section class="stats" id="stats"></section>
  <section class="card">
    <div class="controls">
      <div class="seg" id="view-toggle" role="tablist">
        <button data-view="daily" class="on">Daily</button>

        <button data-view="quarterly">Quarterly</button>
        <button data-view="annual">Annual</button>
      </div>
    </div>
    <div id="chart" class="chart"></div>
  </section>
  <section class="card">
    <div class="controls">
      <h2>Best &amp; worst nights</h2>
      <div class="seg" id="tb-toggle">
        <button data-period="all" class="on">All time</button>
        <button data-period="year">Last year</button>
        <button data-period="quarter">Last 90d</button>
      </div>
    </div>
    <div class="tb" id="tb"></div>
  </section>
</main>
