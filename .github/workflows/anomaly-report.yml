name: Anomaly report

# Builds the review queue of suspicious nights and writes a readable report to
# docs/review/anomalies.md. Re-run any time after excluding days to see what
# remains.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sleep-data
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build anomaly report
        run: python scripts/anomaly_report.py | tee -a $GITHUB_STEP_SUMMARY

      - name: Link to the report
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[Open the full report](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/review/anomalies.md)" >> $GITHUB_STEP_SUMMARY

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: refresh anomaly review report"
            git push
          fi
