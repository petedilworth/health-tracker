name: Daily Sleep Analytics

on:
  schedule:
    # 14:00 UTC is 10am Eastern in summer, 9am in winter. Cron has no timezone,
    # and the winter drift is accepted.
    #
    # Minute 23, not 00, on evidence. All 13 scheduled runs between 2026-08-27
    # and 09-08 fired against a :00 cron and every one was late: 2.7h at best,
    # 3.9h median, 9.8h at worst, none within an hour. GitHub queues scheduled
    # workflows at low priority and the on-the-hour slot is the most contested,
    # so an odd minute is the one lever aimed at the queue itself rather than
    # at working around it. It may not be enough — watch the run times.
    #
    # One run a day. If the ring has not synced by then, dispatch it by hand
    # from the Actions tab: the 30-day lookback plus field-wise upsert makes a
    # re-pull safe at any hour.
    - cron: "23 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sleep-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull data, compute metrics, rebuild site
        env:
          OURA_PAT: ${{ secrets.OURA_PAT }}
        run: python run.py

      - name: Commit updated data & site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            # Eastern, not UTC: the 9pm run fires at 01:00 UTC, which is
            # already tomorrow, so a UTC stamp would misdate the commit.
            git commit -m "data: daily update ($(TZ=America/New_York date +%Y-%m-%d))"
            git push
          fi
