name: Exclude a day

# One-click removal of a bad night (ring not charged, not worn, data error).
# Runnable from the GitHub mobile app. Use action=include to restore a day.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Day(s), YYYY-MM-DD — comma-separated for several"
        required: true
      reason:
        description: "Why (e.g. ring not charged)"
        required: false
        default: ""
      action:
        description: "exclude or include"
        required: true
        default: "exclude"
        type: choice
        options: [exclude, include]

permissions:
  contents: write

concurrency:
  group: sleep-data
  cancel-in-progress: false

jobs:
  exclude:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update exclusions
        run: |
          python scripts/exclude_day.py \
            --date "${{ inputs.date }}" \
            --reason "${{ inputs.reason }}" \
            --action "${{ inputs.action }}" | tee -a $GITHUB_STEP_SUMMARY

      - name: Commit exclusions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No change (day already in that state)."
          else
            git commit -m "data: ${{ inputs.action }} ${{ inputs.date }}"
            git push
          fi
