name: Daily Sleep Analytics

on:
  schedule:
    # Cron is UTC only, so Eastern times drift an hour across DST. Fixed UTC
    # hours, drift accepted: scheduled runs already slip by minutes under load.
    #
    # Twice daily because the ring only syncs when the phone app opens, so the
    # morning run can land before last night's session exists — that is exactly
    # what happened on 2026-09-08, when the 9am pull got Oura's daily score but
    # not the session behind it. The evening run covers it. The 30-day lookback
    # plus field-wise upsert makes the second pull idempotent.
    - cron: "0 13 * * *"   # 9am Eastern in summer, 8am in winter
    - cron: "0 1 * * *"    # 9pm Eastern in summer, 8pm in winter
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sleep-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull data, compute metrics, rebuild site
        env:
          OURA_PAT: ${{ secrets.OURA_PAT }}
        run: python run.py

      - name: Commit updated data & site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            # Eastern, not UTC: the 9pm run fires at 01:00 UTC, which is
            # already tomorrow, so a UTC stamp would misdate the commit.
            git commit -m "data: daily update ($(TZ=America/New_York date +%Y-%m-%d))"
            git push
          fi
